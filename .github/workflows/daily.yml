name: Renewal Desk daily refill
on:
  push:
    branches: [main]
    paths: ['.github/workflows/daily.yml']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      check_only:
        description: Read-only check; do not create posts
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: renewal-desk-buffer
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_refill.py
  refill:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check or refill Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_BOARD_ID: ${{ vars.BUFFER_BOARD_ID }}
          PUBLIC_MEDIA_BASE: https://raw.githubusercontent.com/QaziIhsanAhmad/renewal-desk-automation/main
          CHECK_ONLY: ${{ github.event.inputs.check_only }}
        run: |
          if [ "$CHECK_ONLY" = "true" ]; then
            python refill.py --check
          else
            python refill.py
          fi
