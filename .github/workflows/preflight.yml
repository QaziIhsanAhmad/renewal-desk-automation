name: Buffer read-only preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/preflight.yml', refill.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest test_refill.py
      - run: python refill.py --check
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORGANIZATION_ID: ${{ vars.BUFFER_ORGANIZATION_ID }}
          BUFFER_BOARD_ID: ${{ vars.BUFFER_BOARD_ID }}
